<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주민등록증 모바일 확인서비스</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="정부24">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='uploads/gov_logo_new.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='uploads/gov_icon_new.png') }}">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #e9eef6; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; -webkit-user-select: none; user-select: none; }
        .header { width: 100%; height: 60px; background-color: #f8f9fb; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-sizing: border-box; border-bottom: 1px solid #ddd; position: fixed; top: 0; z-index: 100; }
        .header .left { display: flex; align-items: center; font-size: 18px; font-weight: bold; color: #333; }
        .header .left img { height: 24px; margin-right: 8px; }
        .header .right { font-size: 24px; color: #333; }
        .content-card { background-color: white; width: 92%; max-width: 400px; margin-top: 85px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        .profile-img { width: 140px; height: 175px; object-fit: cover; border-radius: 4px; border: 1px solid #eee; margin-bottom: 25px; }
        .info-section { width: 100%; padding: 0 30px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .info-text { display: flex; flex-direction: column; }
        .info-text .name { font-size: 26px; font-weight: 800; color: #222; margin-bottom: 6px; }
        .info-text .region { font-size: 18px; color: #888; font-weight: 500; }
        .qr-section { width: 100px; height: 100px; }
        .qr-section img { width: 100%; height: 100%; }
        .progress-container { width: 85%; height: 4px; background-color: #eee; border-radius: 2px; margin: 20px 0 10px 0; position: relative; overflow: hidden; }
        .progress-bar { height: 100%; background-color: #4a7cfe; width: 100%; transition: width 1s linear; }
        .timer-text { width: 85%; display: flex; justify-content: space-between; font-size: 14px; color: #4a7cfe; font-weight: 600; margin-bottom: 30px; }
        
        /* 문구 크기 추가 축소 */
        .scan-guide { font-size: 11px; color: #aaa; margin: 0; letter-spacing: -0.5px; opacity: 0.8; }
        .current-time { font-size: 23px; color: #333; font-weight: 800; margin: 4px 0 30px 0; letter-spacing: -0.5px; }
        
        .footer-btn { width: 100%; height: 75px; background-color: #2c62d8; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; }
        .bottom-banner { width: 100%; padding: 15px 0; text-align: center; font-size: 11px; color: #7a869a; background: linear-gradient(to bottom, #e9eef6, #d1d9e6); margin-top: auto; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="header">
        <div class="left">
            <span style="margin-right: 5px;">◀</span>
            <img src="https://www.gov.kr/static/images/logo_gov24.png" alt="정부24">
            <span>주민등록증 모바일 확인서비스</span>
        </div>
        <div class="right">≡</div>
    </div>

    <div class="content-card">
        <img src="{{ imgurl }}" class="profile-img" alt="프로필 사진">
        
        <div class="info-section">
            <div class="info-text">
                <span class="name">{{ name }}</span>
                <span class="region">{{ juso.split(' ' )[0] }} {{ juso.split(' ')[1] if juso.split(' ')|length > 1 else '' }}</span>
            </div>
            <div class="qr-section">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data={{ qr_url }}" alt="QR코드">
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div class="timer-text">
            <span>남은시간</span>
            <span id="timer">30초</span>
        </div>

        <p class="scan-guide">QR코드를 리더기에 스캔하세요.</p>
        <p class="current-time" id="clock"></p>

        <a href="#" class="footer-btn">상세정보 표시</a>
    </div>

    <div class="bottom-banner">
        위·변조 또는 3년이하의 벌금 주민등록증 이미지 위·변조 및 부정 사용 금지 (위반시 )
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${year}년${month}월${day}일 ${hours}:${minutes}:${seconds}`;
        }

        let timeLeft = 30;
        function updateTimer() {
            const timerElement = document.getElementById('timer');
            const progressBar = document.getElementById('progressBar');
            setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft + "초";
                progressBar.style.width = (timeLeft / 30 * 100) + "%";
                if (timeLeft <= 0) timeLeft = 30;
            }, 1000);
        }

        setInterval(updateClock, 1000);
        updateClock();
        updateTimer();
    </script>
</body>
</html>
