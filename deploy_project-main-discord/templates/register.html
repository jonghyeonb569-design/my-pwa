<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 패널</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; padding: 20px; max-width: 900px; margin: auto; background-color: #f0f2f5; color: #333; }
        .admin-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        /* 탭 스타일 */
        .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 25px; gap: 10px; }
        .tab { padding: 12px 25px; cursor: pointer; font-weight: bold; color: #777; transition: 0.3s; border-radius: 8px 8px 0 0; }
        .tab:hover { background: #f8f9fa; }
        .tab.active { color: #007bff; border-bottom: 3px solid #007bff; background: #f0f7ff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 폼 스타일 */
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #555; }
        input[type="text"], input[type="file"], input[type="datetime-local"] { 
            width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 15px;
        }
        button.submit-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button.submit-btn:hover { background-color: #0056b3; }

        /* 테이블 스타일 */
        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; font-weight: bold; color: #555; }
        tr:hover { background-color: #fafafa; }
        .photo-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        
        /* 라이센스 시간 스타일 */
        .countdown { font-family: monospace; font-weight: bold; color: #e74c3c; background: #fdf2f2; padding: 2px 6px; border-radius: 4px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        .badge-unlimited { background: #27ae60; }
        .badge-limited { background: #f39c12; }
        .badge-expired { background: #95a5a6; }

        /* 삭제 버튼 */
        .delete-btn { padding: 5px 10px; background: #ff4757; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .delete-btn:hover { background: #ff6b81; }

        .refresh-btn { float: right; padding: 5px 15px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2 style="margin-top:0; text-align:center;">🚀 통합 관리자 패널</h2>
    
    <div class="tabs">
        <div class="tab active" onclick="openTab('info-tab')">정보입력</div>
        <div class="tab" onclick="openTab('db-tab')">DB 관리</div>
        <div class="tab" onclick="openTab('license-tab')">라이센스 현황</div>
    </div>

    <!-- 1. 정보입력 탭 -->
    <div id="info-tab" class="tab-content active">
        <form id="registerForm" method="post" enctype="multipart/form-data">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" name="name" placeholder="예: 홍길동" required>
                </div>
                <div class="form-group">
                    <label>주민등록번호</label>
                    <input type="text" name="num" placeholder="예: 040101-3537921" required>
                </div>
            </div>
            <div class="form-group">
                <label>집주소 (기본)</label>
                <input type="text" name="juso" placeholder="예: 서울특별시 맥심구 맥심로 283-4" required>
            </div>
            <div class="form-group">
                <label>상세주소</label>
                <input type="text" name="detail_juso" placeholder="예: 101동 101호">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>발행일자</label>
                    <input type="text" name="make" placeholder="예: 2021.10.15" required>
                </div>
                <div class="form-group">
                    <label>발행 지역</label>
                    <input type="text" name="jiname" placeholder="예: 부산광역시 남구청장" required>
                </div>
            </div>
            <div class="form-group">
                <label>만료일 설정 (공란 시 무제한)</label>
                <input type="datetime-local" name="expiry_date">
            </div>
            <div class="form-group">
                <label>라이센스 키 (자동 생성 시 공란)</label>
                <input type="text" name="license_key" placeholder="식별용 키">
            </div>
            <div class="form-group">
                <label>증명 사진</label>
                <input type="file" name="photo" accept="image/*" required>
            </div>
            <button type="submit" class="submit-btn">등록 및 생성</button>
        </form>
    </div>

    <!-- 2. DB 관리 탭 -->
    <div id="db-tab" class="tab-content">
        <button class="refresh-btn" onclick="loadDB()">새로고침</button>
        <h3 style="margin-top:0;">📋 전체 데이터 목록</h3>
        <div class="table-wrapper">
            <table id="db-table">
                <thead>
                    <tr>
                        <th>사진</th>
                        <th>이름</th>
                        <th>주민번호</th>
                        <th>주소</th>
                        <th>지역</th>
                        <th>라이센스</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="db-body">
                    <tr><td colspan="7" style="text-align:center; padding:30px;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 3. 라이센스 현황 탭 -->
    <div id="license-tab" class="tab-content">
        <h3 style="margin-top:0;">⏳ 라이센스 남은 시간</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>라이센스 키</th>
                        <th>만료일자</th>
                        <th>남은 시간</th>
                        <th>상태</th>
                        <th>기간 연장</th>
                    </tr>
                </thead>
                <tbody id="license-body">
                    <tr><td colspan="5" style="text-align:center; padding:30px;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 현재 URL에서 key 파라미터 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const adminKey = urlParams.get('key');

    // 폼 전송 주소에 key 자동 추가
    if (adminKey) {
        document.getElementById('registerForm').action = `/register?key=${adminKey}`;
    }

    // 탭 전환 함수
    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        
        if(tabId === 'db-tab' || tabId === 'license-tab') {
            loadDB();
        }
    }

    // DB 데이터 로드
    let dbData = [];
    async function loadDB() {
        if (!adminKey) return;
        try {
            const response = await fetch(`/api/users?key=${adminKey}`);
            dbData = await response.json();
            renderDB();
            renderLicense();
        } catch (error) {
            console.error('데이터 로드 실패:', error);
        }
    }

    // DB 테이블 렌더링
    function renderDB() {
        const body = document.getElementById('db-body');
        body.innerHTML = dbData.map(user => `
            <tr>
                <td><img src="${user.얼굴사진 || ''}" class="photo-thumb" onerror="this.src='https://via.placeholder.com/40'"></td>
                <td><b>${user.이름}</b></td>
                <td>${user.주민등록번호}</td>
                <td>${user.집주소}</td>
                <td>${user.지역}</td>
                <td><small>${user.license_key || '-'}</small></td>
                <td>
                    <button class="delete-btn" onclick="deleteUser('${user.license_key}')">삭제</button>
                    <a href="/${user.query}" target="_blank" style="text-decoration:none; font-size:11px; color:#007bff; margin-left:5px;">보기</a>
                </td>
            </tr>
        `).join('');
    }

    // 라이센스 현황 렌더링
    function renderLicense() {
        const body = document.getElementById('license-body');
        body.innerHTML = dbData.map(user => {
            const exp = user.expiredate;
            const isUnlimited = !exp || exp === '무제한';
            return `
                <tr data-expiry="${exp}" data-id="${user.id}">
                    <td>${user.이름}</td>
                    <td><small>${user.license_key || '-'}</small></td>
                    <td>${exp || '무제한'}</td>
                    <td><span class="countdown" id="timer-${user.id}">${isUnlimited ? '∞' : '계산 중...'}</span></td>
                    <td>${isUnlimited ? '<span class="badge badge-unlimited">무제한</span>' : '<span class="badge badge-limited">기간제</span>'}</td>
                    <td>
                        <input type="datetime-local" id="extend-${user.id}" style="width: 150px; font-size: 11px; padding: 2px;">
                        <button class="submit-btn" style="width: auto; padding: 2px 8px; font-size: 11px; margin: 0;" onclick="extendLicense('${user.license_key}', '${user.id}')">연장</button>
                    </td>
                </tr>
            `;
        }).join('');
        
        startTimers();
    }

    // 카운트다운 타이머 시작
    function startTimers() {
        const timerInterval = setInterval(() => {
            dbData.forEach(user => {
                const timerEl = document.getElementById(`timer-${user.id}`);
                if (!timerEl || !user.expiredate || user.expiredate === '무제한') return;

                const expiry = new Date(user.expiredate.replace(' ', 'T'));
                const now = new Date();
                const diff = expiry - now;

                if (diff <= 0) {
                    timerEl.innerText = "만료됨";
                    timerEl.style.color = "#95a5a6";
                } else {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const secs = Math.floor((diff % (1000 * 60)) / 1000);
                    timerEl.innerText = `${days}일 ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }
            });
        }, 1000);
    }

    // 라이선스 연장
    async function extendLicense(key, id) {
        const newExpiry = document.getElementById(`extend-${id}`).value;
        if (!newExpiry) {
            alert('연장할 날짜를 선택해주세요.');
            return;
        }
        if (!confirm('라이선스 기간을 연장하시겠습니까?')) return;
        
        try {
            const response = await fetch(`/extend_license?key=${adminKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `license_key=${encodeURIComponent(key)}&expiry_date=${encodeURIComponent(newExpiry)}`
            });
            if (response.ok) {
                alert('연장되었습니다.');
                loadDB();
            } else {
                alert('연장 실패');
            }
        } catch (error) {
            alert('에러 발생');
        }
    }

    // 유저 삭제
    async function deleteUser(key) {
        if(!confirm('정말로 삭제하시겠습니까?')) return;
        try {
            const response = await fetch(`/delete_by_license?key=${adminKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `license_key=${encodeURIComponent(key)}`
            });
            if(response.ok) {
                alert('삭제되었습니다.');
                loadDB();
            } else {
                alert('삭제 실패');
            }
        } catch (error) {
            alert('에러 발생');
        }
    }

    // 초기 로드
    window.onload = loadDB;
</script>

</body>
</html>
